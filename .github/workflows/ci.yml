name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio-plugin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix studio-plugin
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run compile:plugin
      - run: npm test
